name: Release
on:
  push:
    tags: ['thunderbird-v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # full history and all branches, so origin/main can be compared with the tag
      - name: Check the tag commit is on main
        run: |
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "origin/main was not fetched" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" origin/main; then
            echo "Tag $GITHUB_REF_NAME is not on main; release only from commits merged to main" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check tag matches manifest version
        run: |
          version=$(node -p "require('./apps/thunderbird/manifest.json').version")
          if [ "thunderbird-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi
      - run: npm test
      - run: sh scripts/build.sh thunderbird
      - run: sh scripts/package.sh
      - name: Create release with .xpi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#thunderbird-v}
          gh release create "$GITHUB_REF_NAME" "dist/preen-thunderbird-$version.xpi" --title "Preen for Thunderbird $version" --generate-notes
